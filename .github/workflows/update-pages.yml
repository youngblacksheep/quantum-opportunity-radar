name: Update Q·RADAR Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"  # 北京时间每天 09:00

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site with latest Cloudflare snapshots
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://quantum-opportunity-radar.quantum-radar-2026.workers.dev"

          mkdir -p _site/data

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          fetch_json() {
            url="$1"
            output="$2"
            tmp="${output}.tmp"

            echo "Fetching ${url}"

            curl --fail --location --silent --show-error \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 120 \
              "$url" \
              -o "$tmp"

            python3 - "$tmp" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              json.load(f)
          PY

            mv "$tmp" "$output"
          }

          fetch_json \
            "$BASE_URL/api/opportunities" \
            "_site/data/opportunities.json"

          fetch_json \
            "$BASE_URL/api/coverage" \
            "_site/data/coverage.json"

          fetch_json \
            "$BASE_URL/api/approved-teams" \
            "_site/data/approved-teams.json"

          python3 <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "Cloudflare Q·RADAR public APIs"
          }

          Path("_site/data/metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
